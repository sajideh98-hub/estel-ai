<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESTEL AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma, Arial;
    background:linear-gradient(135deg,#09090b,#1e1b4b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:92%;
    max-width:450px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#c4b5fd;
}

.subtitle{
    text-align:center;
    color:#ddd;
    margin-bottom:25px;
}

.chat{
    height:250px;
    overflow:auto;
    background:rgba(0,0,0,.25);
    border-radius:18px;
    padding:15px;
}

.message{
    padding:10px;
    margin:8px 0;
    border-radius:12px;
}

.bot{
    background:#312e81;
}

.user{
    background:#374151;
}

.input-box{
    display:flex;
    gap:8px;
    margin-top:15px;
}

input{
    flex:1;
    padding:14px;
    border-radius:15px;
    border:none;
    outline:none;
    font-size:15px;
}

button{
    border:none;
    border-radius:15px;
    padding:12px 18px;
    background:#8b5cf6;
    color:white;
    font-size:16px;
}
.core{
    width:120px;
    height:120px;
    margin:20px auto;
    border-radius:50%;
    position:relative;
    background:radial-gradient(circle,#ffffff 0%,#c4b5fd 18%,#8b5cf6 45%,#312e81 70%,transparent 72%);
    box-shadow:
        0 0 20px #a78bfa,
        0 0 50px #8b5cf6,
        0 0 90px rgba(139,92,246,.6);
    animation:corePulse 3s ease-in-out infinite;
}

.core::before,
.core::after{
    content:"";
    position:absolute;
    inset:-15px;
    border:1px solid rgba(196,181,253,.45);
    border-radius:50%;
    animation:coreRotate 7s linear infinite;
}

.core::after{
    inset:-28px;
    animation-duration:11s;
    animation-direction:reverse;
}

@keyframes corePulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 20px #a78bfa,
            0 0 50px #8b5cf6,
            0 0 90px rgba(139,92,246,.5);
    }
    50%{
        transform:scale(1.08);
        box-shadow:
            0 0 30px #ddd6fe,
            0 0 70px #8b5cf6,
            0 0 110px rgba(139,92,246,.7);
    }
}

@keyframes coreRotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}ذ</style>

</head>

<body>

<div class="container">

<div class="logo">ESTEL</div>
<div class="core"></div>
<div class="subtitle">دستیار هوشمند شخصی</div>

<div class="chat" id="chat">
<div class="message bot">
سلام، من ESTEL هستم. آماده‌ام کمکت کنم.
</div>
</div>

<div class="input-box">
<input id="input" placeholder="پیام خود را بنویس...">
<button onclick="send()">➤</button>
</div>

</div><script>

function send(){

let input=document.getElementById("input");
let text=input.value.trim();

if(text===""){
return;
}

let chat=document.getElementById("chat");

chat.innerHTML += 
'<div class="message user">'+text+'</div>';

input.value="";

setTimeout(()=>{

chat.innerHTML += 
'<div class="message bot">پیامت دریافت شد. من ESTEL هستم و در حال یادگیری و ارتقا هستم.</div>';

chat.scrollTop=chat.scrollHeight;

},800);

}

</script>

</body>
</html>
